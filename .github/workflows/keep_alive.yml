name: Keep Streamlit App Awake

on:
  schedule:
    # Run every 15 minutes to keep the app actively awake and prevent hibernation
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App & Health Endpoint
        run: |
          echo "Pinging main app URL..."
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --retry 3 --max-time 30 https://smartkyc-validator.streamlit.app/ > /dev/null
          
          echo "Pinging Streamlit internal health endpoint..."
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --retry 3 --max-time 30 https://smartkyc-validator.streamlit.app/_stcore/health > /dev/null
          
          echo "Keep-alive ping completed successfully at $(date -u)"
